<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Post Automation Tool</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 60px auto;
      padding: 0 24px;
      line-height: 1.6;
      color: #222;
    }

    h1 {
      margin-bottom: 8px;
    }

    .box {
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <h1>X Post Automation Tool</h1>

  <div class="box">
    <p>
      This application is a personal content-management and publishing tool
      for an X account.
    </p>

    <p>
      It helps the account owner prepare and publish posts using the X API
      after authorization.
    </p>

    <p>
      The application is intended for personal use and does not sell or
      redistribute X data.
    </p>
  </div>
